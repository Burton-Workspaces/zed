# Burton product identity. Applied at build time onto a disposable worktree.
# Do not edit upstream Zed files; change values here instead.

app_name = "Burton"
bin_name = "burton"
url_scheme = "burton"
app_id_prefix = "dev.burton"

# Windows VERSIONINFO / Flatpak developer. Empty hides "Zed Industries".
company_name = ""

# Auto-update host. Must implement Zed's release API (see burton/README.md).
# Override at runtime with ZED_SERVER_URL for local testing.
update_server_url = "https://updates.burton.dev"
