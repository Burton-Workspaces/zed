[package]
name = "burton-update-dev"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Local Burton update server and Zed extensions reverse-proxy"

# Standalone workspace so this crate is not a member of the Zed tree.
[workspace]

[lib]
path = "src/burton_update_dev.rs"

[[bin]]
name = "burton-update-dev"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "wrap_help"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
